<svg xmlns="http://www.w3.org/2000/svg" width="680" height="454" viewBox="0 0 680 454" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000"/></marker></defs><rect width="680" height="454" fill="#fff"/><rect x="210" y="20" width="260" height="54" fill="#FFFFFF" stroke="#000" stroke-width="1"/><text x="340.0" y="43.0" font-size="14.5" fill="#000" text-anchor="middle">current latent x (state)</text><text x="340.0" y="62.0" font-size="12.5" fill="#666" text-anchor="middle">step k, noise level sigma</text><rect x="40" y="110" width="260" height="54" fill="#DCEAF5" stroke="#000" stroke-width="1"/><text x="170.0" y="133.0" font-size="14.5" fill="#000" text-anchor="middle">forward: positive prompt + x</text><text x="170.0" y="152.0" font-size="12.5" fill="#666" text-anchor="middle">velocity v_cond</text><rect x="380" y="110" width="260" height="54" fill="#DCEAF5" stroke="#000" stroke-width="1"/><text x="510.0" y="133.0" font-size="14.5" fill="#000" text-anchor="middle">forward: negative prompt + x</text><text x="510.0" y="152.0" font-size="12.5" fill="#666" text-anchor="middle">velocity v_uncond</text><rect x="150" y="200" width="380" height="54" fill="#FFFFFF" stroke="#000" stroke-width="1"/><text x="340.0" y="223.0" font-size="14.5" fill="#000" text-anchor="middle">guided velocity v</text><text x="340.0" y="242.0" font-size="12.5" fill="#666" text-anchor="middle">v = v_uncond + 4 x (v_cond - v_uncond)</text><rect x="150" y="290" width="380" height="54" fill="#FFFFFF" stroke="#D55E00" stroke-width="1"/><text x="340.0" y="313.0" font-size="14.5" fill="#000" text-anchor="middle">Gaussian mean and std (policy)</text><text x="340.0" y="332.0" font-size="12.5" fill="#666" text-anchor="middle">from x, v, sigma, eta</text><rect x="150" y="380" width="380" height="54" fill="#FFFFFF" stroke="#D55E00" stroke-width="1"/><text x="340.0" y="403.0" font-size="14.5" fill="#000" text-anchor="middle">x_next = mean + std x noise (action)</text><text x="340.0" y="422.0" font-size="12.5" fill="#666" text-anchor="middle">store x and x_next</text><line x1="290" y1="74" x2="170.0" y2="110" stroke="#000" stroke-width="1" marker-end="url(#a)"/><line x1="390" y1="74" x2="510.0" y2="110" stroke="#000" stroke-width="1" marker-end="url(#a)"/><line x1="170.0" y1="164" x2="290" y2="200" stroke="#000" stroke-width="1" marker-end="url(#a)"/><line x1="510.0" y1="164" x2="390" y2="200" stroke="#000" stroke-width="1" marker-end="url(#a)"/><line x1="340" y1="254" x2="340" y2="290" stroke="#000" stroke-width="1" marker-end="url(#a)"/><line x1="340" y1="344" x2="340" y2="380" stroke="#000" stroke-width="1" marker-end="url(#a)"/></svg>